<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DPS Smart School ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7ff;--card:#fff;--ink:#0f2447;--mut:#5b6b8a;--pri:#1f4fd8;--pri2:#0d2b7a;--line:#dbe5fa;--ok:#12805c;--bad:#c62f3b;--warn:#b7791f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1428;--card:#13203d;--ink:#e8eefc;--mut:#9fb0d3;--pri:#6c93ff;--pri2:#0a1a45;--line:#243558;--ok:#4fd1a1;--bad:#ff7b86;--warn:#f0b955}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Mukta,system-ui,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--pri);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--pri);border:1px solid var(--line)}button.red{background:var(--bad)}
input,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
label{font-size:14px;color:var(--mut);font-weight:600}
:focus-visible{outline:3px solid #f5a623;outline-offset:2px}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--pri2),var(--pri))}
.lbox{background:var(--card);border-radius:18px;padding:28px;width:100%;max-width:400px;text-align:center}
.lbox img{width:110px;height:110px;border-radius:50%}.lbox h1{margin:8px 0 0;font-size:26px;font-weight:800;color:var(--pri)}
.lbox p{margin:2px 0 16px;color:var(--mut);font-size:14px}.lbox .f{text-align:left;margin-bottom:12px}
#err{color:var(--bad);min-height:22px;font-size:14px}
#app{display:none;min-height:100vh}
aside{position:fixed;inset:0 auto 0 0;width:250px;background:var(--pri2);color:#fff;padding:16px 10px;overflow:auto;z-index:20;transition:transform .2s;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid #ffffff25;margin-bottom:10px}
.brand img{width:44px;height:44px;border-radius:50%;background:#fff}.brand b{display:block;line-height:1.1}.brand small{opacity:.7}
aside a{display:block;padding:10px 12px;border-radius:8px;color:#dbe6ff;text-decoration:none;cursor:pointer;margin-bottom:2px}
aside a.on,aside a:hover{background:#ffffff22;color:#fff}
main{margin-left:250px}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top,0px));z-index:10}
header h2{margin:0;font-size:20px;flex:1}#ham{display:none;background:var(--pri2)}
.av{width:36px;height:36px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800}
.who{line-height:1.1;font-size:14px}.who small{color:var(--mut)}
section{padding:20px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{margin:0 0 10px;font-size:17px}
.stat b{font-size:30px;display:block;line-height:1.1;color:var(--pri)}.stat span{color:var(--mut);font-size:14px}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:14px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-size:13px}
.pill{padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--line)}
.pill.ok{color:var(--ok)}.pill.bad{color:var(--bad)}.pill.w{color:var(--warn)}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{background:var(--bg);border:1px solid var(--line);padding:4px 12px;border-radius:99px;font-size:14px}
#modal{display:none;position:fixed;inset:0;background:#0009;place-items:center;z-index:50;padding:16px}
#modal .box{background:#fff;color:#000;border-radius:12px;padding:22px;max-width:420px;width:100%}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--pri2);color:#fff;padding:10px 18px;border-radius:99px;display:none;z-index:60}
@media(max-width:820px){aside{transform:translateX(-100%)}aside.open{transform:none}main{margin-left:0}#ham{display:block}.who{display:none}}
.slip{border:1.5px solid #000;background:#fff;color:#000;font:14px/1.4 Arial,Helvetica,sans-serif}
.slip *{color:#000}
.slip[contenteditable=true]{outline:2px dashed #2563eb;outline-offset:3px;cursor:text}.slip[contenteditable=true]:focus{outline-style:solid}.edhint{font-size:13px;color:var(--mut);margin:0 0 8px}
.slip .hd{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid #000}
.slip .hd img{width:66px;height:66px;object-fit:contain;flex:none}
.slip .hd div{flex:1;text-align:center}
.slip .hd b{display:block;font-size:20px;line-height:1.15}
.slip .hd small{display:block;font-size:12px;margin-top:2px}
.slip .ttl{text-align:center;font-weight:700;font-size:15px;padding:5px 12px;border-bottom:1px solid #000}
.slip .fl{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #000}
.slip .fl div{padding:6px 12px;border-bottom:1px dotted #999;overflow-wrap:anywhere}
.slip .fl div:nth-last-child(-n+2){border-bottom:0}
.slip .fl div:nth-child(odd){border-right:1px dotted #999}
.slip .fl.one{grid-template-columns:1fr}.slip .fl.one div{border-right:0}
.slip .fl span{font-weight:700}
.slip table{width:100%;border-collapse:collapse}
.slip th,.slip td{border:1px solid #000;padding:5px 8px;white-space:normal;text-align:left;font-size:14px;font-weight:400}
.slip th{text-align:center;font-weight:700}
.slip th:first-child,.slip td:first-child{border-left:0;width:54px;text-align:center}
.slip th:last-child,.slip td:last-child{border-right:0;width:110px;text-align:right}
.slip th:last-child{text-align:center}
.slip tr:first-child th{border-top:0}
.slip td.t{text-align:right;font-weight:700}
.slip .pb{padding:8px 12px;border-bottom:1px solid #000}
.slip .sg{display:flex;gap:24px;padding:38px 12px 8px;text-align:center;font-size:13px}
.slip .sg div{flex:1;border-top:1px solid #000;padding-top:4px}
.slip .nt{border-top:1px solid #000;text-align:center;font-size:12px;padding:4px 8px}
#modal .box.sl{padding:12px;max-width:560px;max-height:96vh;overflow:auto}
@media print{.slip[contenteditable=true]{outline:0!important}body>*:not(#modal){display:none!important}#modal{display:grid!important;background:#fff;position:static;padding:0}#modal .box.sl{padding:0;max-width:none;max-height:none;overflow:visible}.np{display:none}@page{margin:12mm}}
</style></head><body>

const paid=s=>DB.pay.filter(p=>p.sid===s.id).reduce((a,p)=>a+p.amt,0);
const due=s=>Math.max(0,feeOf(s)*monthsDue()-paid(s));
const attPct=s=>{const d=Object.values(DB.att);const r=d.map(x=>x[s.id]).filter(Boolean);return r.length?Math.round(100*r.filter(v=>v!=='A').length/r.length):null};

$('#lf').onsubmit=async e=>{e.preventDefault();const h=await hp($('#un').value,$('#pw').value);
const u=DB.users.find(x=>x.name.toLowerCase()===$('#un').value.trim().toLowerCase()&&x.h===h);
if(!u){$('#err').textContent='Wrong username or password. Check both and try again.';return}
ME=u;$('#err').textContent='';$('#login').style.display='none';$('#app').style.display='block';log('Logged in');go('dash')};
$('#out').onclick=()=>{log('Logged out');ME=null;$('#app').style.display='none';$('#login').style.display='grid';$('#pw').value=''};

function bars(d,l,col){const mx=Math.max(...d,1);return`<svg viewBox="0 0 300 140" width="100%" role="img">${d.map((v,i)=>{const h=v/mx*100;return`<rect x="${12+i*(276/d.length)}" y="${110-h}" width="${276/d.length-12}" height="${h}" rx="4" fill="${col}"/><text x="${12+i*(276/d.length)+(276/d.length-12)/2}" y="128" font-size="10" text-anchor="middle" fill="currentColor">${l[i]}</text><text x="${12+i*(276/d.length)+(276/d.length-12)/2}" y="${105-h}" font-size="10" text-anchor="middle" fill="currentColor">${v}</text>`}).join('')}</svg>`}
const tbl=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}">Nothing here yet.</td></tr>`}</table></div>`;
const myKid=()=>DB.students.find(s=>s.adm===ME.adm);

const V={
dash(){const S=DB.students;
if(ME.role==='parent'||ME.role==='student'){const s=myKid();if(!s)return`<div class="card">No student is linked to this login yet. Ask the school admin to link an admission number.</div>`;
const a=attPct(s);return`<div class="grid"><div class="card stat"><b>${esc(s.name)}</b><span>${esc(s.adm)} · Class ${s.cls}-${s.sec}</span></div><div class="card stat"><b>${a===null?'–':a+'%'}</b><span>Attendance</span></div><div class="card stat"><b>₹${due(s)}</b><span>Fee pending</span></div></div>`}
const days=Object.keys(DB.att).sort().slice(-7),ad=days.map(d=>Object.values(DB.att[d]).filter(v=>v!=='A').length),al=days.map(d=>d.slice(5));
const mc={};DB.pay.forEach(p=>{const k=p.date.slice(5,7);mc[k]=(mc[k]||0)+p.amt});const mk=Object.keys(mc).sort();
const tp=DB.pay.reduce((a,p)=>a+p.amt,0),pd=S.reduce((a,s)=>a+due(s),0);
return`<div class="grid"><div class="card stat"><b>${S.length}</b><span>Students enrolled</span></div><div class="card stat"><b>${DB.users.length}</b><span>User logins</span></div><div class="card stat"><b>₹${tp}</b><span>Fee collected</span></div><div class="card stat"><b>₹${pd}</b><span>Fee pending</span></div></div>
<div class="row"><button onclick="go('attendance')">Mark attendance</button>${MENU[ME.role].includes('fees')?`<button onclick="go('fees')">Collect fee</button>`:''}${MENU[ME.role].includes('students')?`<button onclick="go('students')">Add student</button>`:''}<button class="ghost" onclick="go('notices')">Post notice</button></div>
<div class="two"><div class="card"><h3>Students present (last days)</h3>${days.length?bars(ad,al,'#1f4fd8'):'<p>Mark attendance to see this graph.</p>'}</div>
<div class="card"><h3>Fee collection by month</h3>${mk.length?bars(mk.map(k=>mc[k]),mk,'#12805c'):'<p>Collect a fee to see this graph.</p>'}</div></div>
<div class="card" style="margin-top:14px"><h3>Recent activity</h3>${tbl(['When','Who','What'],DB.log.slice(0,8).map(l=>[l.d,esc(l.w),esc(l.t)]))}</div>`},

students(){const can=['admin','principal'].includes(ME.role),S=DB.students.filter(s=>ME.role!=='teacher'||s.cls===ME.cls);
return lookupCard()+(can?`<div class="card"><h3>Add student</h3><form class="form" onsubmit="addStu(event)"><div><label>Name</label><input name="name" required></div><div><label>Father's name</label><input name="father" required></div><div><label>Mother's name</label><input name="mother"></div><div><label>Date of birth</label><input type="date" name="dob" required></div><div><label>Gender</label><select name="gender"><option>Male</option><option>Female</option></select></div><div><label>Class</label><select name="cls">${CLASSES.map(c=>`<option>${c}</option>`).join('')}</select></div><div><label>Section</label><input name="sec" value="A"></div><div><label>Roll no.</label><input name="roll" type="number" value="1"></div><div><label>Parent mobile</label><input name="mobile" type="tel" required></div><div><label>Address</label><input name="addr"></div><button>Save student</button></form></div>`:'')+
`<div class="card" style="margin-top:14px"><h3>All students (${S.length})</h3>${tbl(['Adm. No.','Name','Father','Class','Roll','Mobile','Status'],S.map(s=>[s.adm,esc(s.name),esc(s.father),s.cls+'-'+s.sec,s.roll,esc(s.mobile),`<span class="pill ok">${s.status}</span>`]))}</div>`},

attendance(){const cl=ME.role==='teacher'?[ME.cls||'5']:CLASSES;
return`<div class="card"><h3>Mark attendance</h3><div class="form"><div><label>Class</label><select id="ac" onchange="attList()">${cl.map(c=>`<option>${c}</option>`).join('')}</select></div><div><label>Date</label><input type="date" id="ad" value="${today()}" onchange="attList()"></div></div>${ME.role==='teacher'?`<p style="color:var(--mut);margin:0 0 8px">You can mark attendance only for your own class.</p>`:''}<div id="al"></div></div>`+`<img src="" onerror="attList();this.remove()" alt="" width="1" height="1">`},

fees(){const S=DB.students;
return`<div class="card"><h3>Collect fee</h3><form class="form" onsubmit="payFee(event)"><div><label>Student</label><select name="sid">${S.map(s=>`<option value="${s.id}">${esc(s.name)} (${s.adm})</option>`).join('')}</select></div><div><label>Amount (₹)</label><input name="amt" type="number" min="1" required></div><div><label>Mode</label><select name="mode"><option>Cash</option><option>UPI</option><option>Bank</option></select></div><button>Save & make receipt</button></form></div>
<div class="card" style="margin-top:14px"><h3>Fee status · ${monthsDue()} months billed</h3>${tbl(['Student','Class','Monthly','Paid','Pending','Status'],S.map(s=>[esc(s.name),s.cls,'₹'+feeOf(s),'₹'+paid(s),'₹'+due(s),due(s)?`<span class="pill bad">Pending</span>`:`<span class="pill ok">Paid</span>`]))}</div>
<div class="card" style="margin-top:14px"><h3>Payment records</h3>${tbl(['Receipt','Date','Student','Amount','Mode','Slip'],DB.pay.slice().reverse().map(p=>['R-'+p.no,p.date,esc(DB.students.find(s=>s.id===p.sid)?.name),'₹'+p.amt,p.mode,`<button class="ghost" onclick="receiptModal(${p.no})">Print slip</button>`]))}<p style="color:var(--mut);font-size:14px">Payments are permanent records and cannot be edited.</p></div>`},

staff(){return`<div class="card"><h3>Add teacher / staff</h3><form class="form" onsubmit="addStaff(event)"><div><label>Name</label><input name="name" required></div><div><label>Employee ID</label><input name="eid" value="EMP-${DB.staff.length+101}"></div><div><label>Qualification</label><input name="q"></div><div><label>Mobile</label><input name="m" type="tel"></div><div><label>Class / subject</label><input name="cs"></div><div><label>Monthly salary (₹)</label><input name="sal" type="number"></div><button>Save</button></form></div><div class="card" style="margin-top:14px">${tbl(['ID','Name','Qualification','Mobile','Assigned','Salary'],DB.staff.map(s=>[s.eid,esc(s.name),esc(s.q),esc(s.m),esc(s.cs),'₹'+(s.sal||0)]))}</div>`},

salary(){const S=DB.staff,m=new Date().toISOString().slice(0,7),L=DB.sal=DB.sal||[];const pd=s=>L.filter(p=>p.eid===s.eid&&p.month===m).reduce((a,p)=>a+p.amt,0);const tot=S.reduce((a,s)=>a+(+s.sal||0),0),done=S.reduce((a,s)=>a+pd(s),0);
return`<div class="grid"><div class="card stat"><b>${S.length}</b><span>Staff members</span></div><div class="card stat"><b>₹${tot}</b><span>Total monthly salary</span></div><div class="card stat"><b>₹${done}</b><span>Paid in ${m}</span></div><div class="card stat"><b>₹${Math.max(0,tot-done)}</b><span>Pending in ${m}</span></div></div>
<div class="card" style="margin-top:14px"><h3>Pay salary</h3>${S.length?`<form class="form" onsubmit="paySal(event)"><div><label>Staff</label><select name="eid">${S.map(s=>`<option value="${esc(s.eid)}">${esc(s.name)} (${esc(s.eid)})</option>`).join('')}</select></div><div><label>Month</label><input type="month" name="month" value="${m}" required></div><div><label>Amount (₹)</label><input name="amt" type="number" min="1" required></div><div><label>Mode</label><select name="mode"><option>Cash</option><option>UPI</option><option>Bank</option></select></div><button>Save salary payment</button></form>`:'<p>No staff yet. Admin can add teachers in Teachers & Staff.</p>'}</div>
<div class="card" style="margin-top:14px"><h3>Salary status · ${m}</h3>${tbl(['ID','Name','Class / subject','Monthly salary','Paid','Status'],S.map(s=>[esc(s.eid),esc(s.name),esc(s.cs),'₹'+(s.sal||0),'₹'+pd(s),pd(s)>=(+s.sal||0)&&s.sal?'<span class="pill ok">Paid</span>':'<span class="pill bad">Pending</span>']))}</div>
<div class="card" style="margin-top:14px"><h3>Salary payment records</h3>${tbl(['Voucher','Date','Month','Staff','Amount','Mode','Slip'],L.slice().reverse().map(p=>['S-'+p.no,p.date,p.month,esc(DB.staff.find(s=>s.eid===p.eid)?.name),'₹'+p.amt,p.mode,`<button class="ghost" onclick="slipModal(${p.no})">Print slip</button>`]))}</div>`},
notices(){return(['admin','principal'].includes(ME.role)?`<div class="card"><form class="form" onsubmit="addNote(event)"><div style="grid-column:1/-1"><label>New notice for parents and students</label><input name="t" required></div><button>Publish notice</button></form></div>`:'')+`<div class="card" style="margin-top:14px">${tbl(['Date','Notice'],DB.notices.map(n=>[n.d,esc(n.t)]))}</div>`},

users(){return`<div class="card"><h3>Create login</h3><form class="form" onsubmit="addUser(event)"><div><label>Username</label><input name="name" required></div><div><label>Password</label><input name="pw" required minlength="6"></div><div><label>Role</label><select name="role">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div><label>Class (teacher)</label><select name="cls">${CLASSES.map(c=>`<option>${c}</option>`).join('')}</select></div><div><label>Admission no. (parent / student)</label><input name="adm" placeholder="1000"></div><button>Create login</button></form></div>
<div class="card" style="margin-top:14px"><h3>All logins</h3>${tbl(['Username','Role','Link','Actions'],DB.users.map(u=>[esc(u.name),ROLES[u.role],esc(u.adm||(u.role==='teacher'?'Class '+u.cls:'')),`<button class="ghost" onclick="chPw('${u.id}')">Change password</button> ${u.id==='u1'?'':`<button class="red" onclick="delU('${u.id}')">Delete</button>`}`]))}</div>`},

feat(){return`<div class="card"><h3>${ROLES[ME.role]} panel</h3><div class="chips">${FEAT[ME.role].split(',').map(x=>`<span>${x}</span>`).join('')}</div><p style="color:var(--mut)">These modules are planned in the full ERP. WhatsApp alerts, GPS tracking and online payment need a server and paid services to go live.</p></div>`}
};

const LOGO=document.querySelector('#login img').src;
const rs=n=>'₹'+(+n||0).toLocaleString('en-IN');
function slip(o){const F=(o.fields||[]).map(([k,v])=>`<div><span>${k}:</span> ${v}</div>`).join(''),X=(o.extra||[]).map(([k,v])=>`<div><span>${k}:</span> ${v}</div>`).join('');
const rows=o.rows.map((r,n)=>`<tr><td>${n+1}</td><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')+'<tr><td>&nbsp;</td><td></td><td></td></tr>'.repeat(Math.max(0,3-o.rows.length));
return`<div class="slip"><div class="hd"><img src="${LOGO}" alt="Delhi Public School logo"><div><b>Delhi Public School</b><small>Dainikhand, Jamui, Bihar</small></div></div>
<div class="ttl">${o.title}</div><div class="fl">${F}</div>
<table><tr><th>Sr. No.</th><th>Particulars</th><th>Amount</th></tr>${rows}<tr><td></td><td class="t">${o.totalLabel||'Total'}</td><td class="t">${o.total}</td></tr></table>
${X?`<div class="fl">${X}</div>`:''}${o.paidBy?`<div class="pb">Paid by: <b><u>${o.paidBy}</u></b></div>`:''}
<div class="sg"><div>${o.sig1||"Director's signature"}</div><div>${o.sig2||"Principal's signature"}</div></div>
<div class="nt">${o.note}</div></div>`}
function showSlip(o,after){const b=$('#mbox');b.className='box sl';b.innerHTML=`<p class="edhint np">✏️ Slip par kahin bhi click karke kuch bhi edit karein (naam, amount, date, particulars). Print se pehle bhi edit kar sakte hain.</p><div id="slipWrap">`+slip(o)+`</div><div class="row np"><button onclick="print()">Print</button><button class="ghost" onclick="slipAddRow()">+ Row</button><button class="ghost" onclick="slipDelRow()">− Row</button><button class="ghost" onclick="slipReset()">Reset</button><button class="ghost" onclick="$('#modal').style.display='none';${after||''}">Close</button></div>`;window._slipHTML=$('#slipWrap').innerHTML;slipEditable();$('#modal').style.display='grid'}
function slipEditable(){const e=$('#slipWrap .slip');if(e)e.setAttribute('contenteditable','true')}
function slipReset(){$('#slipWrap').innerHTML=window._slipHTML;slipEditable()}
function slipAddRow(){const t=$('#slipWrap .slip table'),r=t.rows,tot=r[r.length-1],n=document.createElement('tr');n.innerHTML='<td>'+(r.length-2)+'</td><td>&nbsp;</td><td>&nbsp;</td>';tot.parentNode.insertBefore(n,tot)}
function slipDelRow(){const t=$('#slipWrap .slip table'),r=t.rows;if(r.length>3)r[r.length-2].remove()}
function receiptModal(no,after){const p=DB.pay.find(x=>x.no===no),s=DB.students.find(x=>x.id===p.sid),got=DB.pay.filter(x=>x.sid===s.id&&x.no<=p.no).reduce((a,x)=>a+x.amt,0),bal=Math.max(0,feeOf(s)*monthsDue()-got),pm=MN.slice(0,monthsDue()).filter((m,i)=>(i+1)*feeOf(s)>got);
showSlip({title:'Fee Receipt',fields:[['Receipt No.','R-'+p.no],['Date',esc(p.date)],['Name of student',esc(s.name)],['Class',s.cls+'-'+s.sec],['Admission no.',esc(s.adm)],["Father's name",esc(s.father)]],rows:[['Fee received',rs(p.amt)]],total:rs(p.amt),extra:[['Total received so far',rs(got)],['Balance pending',rs(bal)],['Pending months',pm.join(', ')||'None']],paidBy:esc(p.mode),note:'All above mentioned amount, once paid, is non-refundable in any case whatsoever.'},after)}
const MN=['April','May','June','July','August','September','October','November','December','January','February','March'];
const pendM=s=>{const f=feeOf(s),p=paid(s);return MN.slice(0,monthsDue()).filter((m,i)=>(i+1)*f>p)};
function lookupCard(){return`<div class="card" style="margin-bottom:14px"><h3>Find student by admission number</h3><div class="form"><div><label for="lk">Admission no.</label><input id="lk" inputmode="numeric" placeholder="1000" oninput="findStu()"></div></div><div id="lkr"></div></div>`}
function findStu(){const v=$('#lk').value.trim(),r=$('#lkr');if(!v){r.innerHTML='';return}
const s=DB.students.find(x=>x.adm===v&&(ME.role!=='teacher'||x.cls===ME.cls));if(!s){r.innerHTML='<p>No student found with this admission number. Check the number and try again.</p>';return}
const money=ME.role!=='teacher',a=attPct(s),pm=pendM(s);
r.innerHTML=`<div class="grid"><div class="card"><h3>${esc(s.name)}</h3><p style="margin:0">Admission no.: <b>${s.adm}</b><br>Class: ${s.cls}-${s.sec} · Roll ${s.roll}<br>Father: ${esc(s.father)}<br>Mother: ${esc(s.mother)}<br>Date of birth: ${esc(s.dob)} · ${s.gender}<br>Mobile: ${esc(s.mobile)}<br>Address: ${esc(s.addr)}<br>Attendance: ${a===null?'–':a+'%'}</p></div>${money?`<div class="card"><h3>Fee details</h3><p style="margin:0 0 8px">Monthly fee: <b>₹${feeOf(s)}</b><br>Months billed: ${monthsDue()}<br>Total fee: ₹${feeOf(s)*monthsDue()}<br>Received: ₹${paid(s)}<br>Due: <b style="color:var(--bad)">₹${due(s)}</b></p><label>Pending months</label><div class="chips">${pm.map(m=>`<span>${m}</span>`).join('')||'<span>No month pending</span>'}</div><div class="row"><button onclick="billModal(${s.id})">Print fee bill</button></div></div>`:''}</div>`}
function billModal(id){const s=DB.students.find(x=>x.id===id),pm=pendM(s);
showSlip({title:'Fee Demand Bill',fields:[['Date',today()],['Admission no.',esc(s.adm)],['Name of student',esc(s.name)],['Class',s.cls+'-'+s.sec],["Father's name",esc(s.father)],['Monthly fee',rs(feeOf(s))],['Pending months',pm.join(', ')||'None']],rows:[['Fee for '+monthsDue()+' months billed ('+rs(feeOf(s))+' × '+monthsDue()+')',rs(feeOf(s)*monthsDue())],['Less: received so far','− '+rs(paid(s))]],totalLabel:'Total due',total:rs(due(s)),note:'Please pay the above dues at the school office.'})}
function addStu(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const id=Math.max(0,...DB.students.map(s=>s.id))+1;
const adm=String(Math.max(999,...DB.students.map(s=>+s.adm||0))+1);DB.students.push({...f,id,adm,status:'Active'});log('Added student '+f.name);save();toast('Student saved. Admission no. '+adm);go('students')}
function attList(){const c=$('#ac').value,d=$('#ad').value,S=DB.students.filter(s=>s.cls===c),cur=DB.att[d]||{};
$('#al').innerHTML=S.length?tbl(['Roll','Name','Status'],S.map(s=>[s.roll,esc(s.name),['P','A','L'].map(v=>`<label style="margin-right:12px"><input type="radio" style="width:auto" name="s${s.id}" value="${v}" ${(cur[s.id]||'P')===v?'checked':''}> ${v==='P'?'Present':v==='A'?'Absent':'Late'}</label>`).join('')]))+`<div class="row"><button onclick="saveAtt()">Save attendance</button></div>`:'<p>No students in this class yet.</p>'}
function saveAtt(){const c=$('#ac').value,d=$('#ad').value;DB.att[d]=DB.att[d]||{};let ab=0;
DB.students.filter(s=>s.cls===c).forEach(s=>{const v=document.querySelector(`input[name=s${s.id}]:checked`).value;DB.att[d][s.id]=v;if(v==='A')ab++});
log(`Attendance saved, class ${c}, ${ab} absent`);save();toast(ab?`Saved. ${ab} absent parent alert(s) queued`:'Attendance saved')}
function payFee(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),s=DB.students.find(x=>x.id==f.sid);
const p={no:DB.pay.length+1001,sid:s.id,amt:+f.amt,mode:f.mode,date:today()};DB.pay.push(p);log(`Fee ₹${p.amt} received from ${s.name}`);save();
receiptModal(p.no,"go('fees')")}
function slipModal(no){const p=DB.sal.find(x=>x.no===no),s=DB.staff.find(x=>x.eid===p.eid)||{};const pmo=[...new Set(DB.sal.filter(x=>x.eid===p.eid).map(x=>x.month))].sort().filter(m=>DB.sal.filter(x=>x.eid===p.eid&&x.month===m).reduce((a,x)=>a+x.amt,0)<(+s.sal||0)).join(', ');const bal=Math.max(0,(+s.sal||0)-DB.sal.filter(x=>x.eid===p.eid&&x.month===p.month).reduce((a,x)=>a+x.amt,0));
showSlip({title:'Salary Slip',fields:[['Slip No.','S-'+p.no],['Date',esc(p.date)],['Name',esc(s.name)],['Employee ID',esc(s.eid)],['Qualification',esc(s.q)],['Class / subject',esc(s.cs)],['Salary month',esc(p.month)],['Monthly salary',rs(s.sal)]],rows:[['Salary paid for '+esc(p.month),rs(p.amt)]],totalLabel:'Total paid',total:rs(p.amt),extra:[['Balance for this month',rs(bal)],['Pending salary months',pmo||'None']],paidBy:esc(p.mode),sig1:"Employee's signature",sig2:"Principal's signature",note:'This is a computer-generated salary slip of Delhi Public School, Jamui.'},"go('salary')")}
function paySal(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),s=DB.staff.find(x=>x.eid===f.eid);DB.sal=DB.sal||[];const p={no:DB.sal.length+5001,eid:s.eid,month:f.month,amt:+f.amt,mode:f.mode,date:today()};DB.sal.push(p);log(`Salary ₹${p.amt} paid to ${s.name}`);save();toast('Salary payment saved');slipModal(p.no)}
function addStaff(e){e.preventDefault();DB.staff.push(Object.fromEntries(new FormData(e.target)));log('Added staff');save();go('staff')}
function addNote(e){e.preventDefault();DB.notices.unshift({d:today(),t:new FormData(e.target).get('t')});log('Notice published');save();go('notices')}
async function addUser(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
if(DB.users.some(u=>u.name.toLowerCase()===f.name.trim().toLowerCase()))return toast('That username already exists');
DB.users.push({id:'u'+Date.now(),name:f.name.trim(),role:f.role,cls:f.cls,adm:f.adm,h:await hp(f.name,f.pw)});log('Created login '+f.name);save();toast('Login created');go('users')}
async function chPw(id){const p=prompt('Enter new password (min 6 characters)');if(!p||p.length<6)return;const u=DB.users.find(x=>x.id===id);u.h=await hp(u.name,p);log('Changed password of '+u.name);save();toast('Password changed')}
function delU(id){if(!confirm('Delete this login?'))return;DB.users=DB.users.filter(u=>u.id!==id);log('Deleted a login');save();go('users')}
</script></body></html>
